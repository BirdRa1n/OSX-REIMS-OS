# Preseed do instalador (Debian Installer) — OSX-REIMS-OS.
#
# Filosofia: automatizar tudo EXCETO o que o usuário deve escolher —
# **disco** (partman) e **senha** (user-setup). Esses ficam interativos,
# resultando num instalador curto no estilo Debian.
#
# ⚠️ Precisa de ajuste/validação numa Debian real (Fase 2).

# Locale / teclado (ajuste conforme o público-alvo)
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select br

# Rede: DHCP automático
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string osx-reims
d-i netcfg/get_domain string local

# Relógio / fuso
d-i clock-setup/utc boolean true
d-i time/zone string America/Sao_Paulo
d-i clock-setup/ntp boolean true

# Espelho (usado se o instalador baixar pacotes)
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

# Particionamento: NÃO preseedado de propósito → o usuário escolhe o disco.
#   (o instalador vai perguntar; usa o disco inteiro conforme a escolha)

# Usuário/senha: NÃO preseedado de propósito → o usuário define a senha.
d-i passwd/root-login boolean true

# Sem tarefas extras (appliance enxuto)
tasksel tasksel/first multiselect
d-i pkgsel/include string
d-i pkgsel/upgrade select none

# GRUB no disco escolhido (UEFI)
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string default

# Finaliza sem perguntar
d-i finish-install/reboot_in_progress note
