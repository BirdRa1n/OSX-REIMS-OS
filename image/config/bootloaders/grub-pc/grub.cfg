# Menu de boot do pendrive (GRUB UEFI). O live-build copia esta pasta para
# boot/grub/ da ISO; as entradas acham o kernel sozinhas (live/vmlinuz[-versão]).
set default=0
set timeout=10
set timeout_style=menu

insmod all_video
insmod gfxterm
insmod png
insmod regexp

if loadfont $prefix/unicode.pf2 || loadfont unicode; then
	set gfxmode=auto
	terminal_output gfxterm
	set theme=$prefix/theme/theme.txt
fi

set kernel=/live/vmlinuz
set initrd=/live/initrd.img
for k in /live/vmlinuz-*; do
	if [ -f "$k" ]; then
		regexp --set=1:kv '^/live/vmlinuz-(.*)$' "$k"
		set kernel="$k"
		set initrd="/live/initrd.img-$kv"
	fi
done
set opts="boot=live components quiet splash noeject live-config.noautologin live-config.nottyautologin live-config.hostname=reims-os"
export kernel initrd opts

menuentry "Install OSX-REIMS-OS" --id install {
	linux $kernel $opts reims.mode=install
	initrd $initrd
}

menuentry "Install OSX-REIMS-OS (safe graphics)" --id install-safe {
	linux $kernel $opts nomodeset reims.mode=install
	initrd $initrd
}

submenu "Advanced / Rescue ..." --id advanced {
	menuentry "Rescue console (root shell)" --id rescue {
		linux $kernel $opts reims.mode=rescue
		initrd $initrd
	}
	menuentry "Rescue console (root shell, safe graphics)" --id rescue-safe {
		linux $kernel $opts nomodeset reims.mode=rescue
		initrd $initrd
	}
	menuentry "Live system (no installer)" --id live {
		linux $kernel $opts reims.mode=live
		initrd $initrd
	}
	menuentry "Check this medium for damage" --id check {
		linux $kernel $opts verify-checksums reims.mode=install
		initrd $initrd
	}
	menuentry "Firmware setup (UEFI)" --id fwsetup {
		fwsetup
	}
	menuentry "Restart" --id reboot {
		reboot
	}
}
