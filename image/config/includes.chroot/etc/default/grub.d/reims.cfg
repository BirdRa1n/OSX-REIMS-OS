# GRUB do sistema instalado: menu escondido (Esc durante 1 s o mostra), tela de
# carregamento, e o console de resgate em Advanced options (recovery mode).
GRUB_DISTRIBUTOR="OSX-REIMS-OS"
GRUB_TIMEOUT=1
GRUB_TIMEOUT_STYLE=hidden
GRUB_CMDLINE_LINUX_DEFAULT="quiet splash loglevel=3 udev.log_level=3 vt.global_cursor_default=0"
# o root fica travado: o modo de recuperação abre um shell de root mesmo assim.
GRUB_CMDLINE_LINUX="SYSTEMD_SULOGIN_FORCE=1"
GRUB_DISABLE_OS_PROBER=true
GRUB_GFXMODE=auto
GRUB_GFXPAYLOAD_LINUX=keep
