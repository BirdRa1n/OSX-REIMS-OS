[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/tui",
    "crates/cli",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["OSX-REIMS-OS contributors"]
repository = "https://github.com/BirdRa1n/OSX-REIMS-OS"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

reimsctl-core = { path = "crates/core" }
reimsctl-tui = { path = "crates/tui" }
