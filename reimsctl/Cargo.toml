[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/efi",
    "crates/macos",
    "crates/updater",
    "crates/tui",
    "crates/cli",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["OSX-REIMS-OS contributors"]
repository = "https://github.com/BirdRa1n/OSX-REIMS-OS"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
plist = "1"
ureq = "2"

reimsctl-core = { path = "crates/core" }
reimsctl-efi = { path = "crates/efi" }
reimsctl-macos = { path = "crates/macos" }
reimsctl-updater = { path = "crates/updater" }
reimsctl-tui = { path = "crates/tui" }
