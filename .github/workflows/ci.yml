name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  reimsctl:
    name: reimsctl (fmt + clippy + build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reimsctl
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: reimsctl

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace

  shell:
    name: image scripts (bash -n + shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax
        run: |
          set -e
          inc=image/config/includes.chroot
          for f in $inc/usr/local/sbin/* $inc/usr/local/bin/reims-* \
                   $inc/usr/lib/reims/brand.sh $inc/etc/profile.d/*.sh \
                   $inc/etc/grub.d/* $inc/etc/kernel/post*.d/* \
                   image/config/hooks/live/*.chroot image/auto/config scripts/*.sh; do
            bash -n "$f"
          done

      - name: Shellcheck
        run: |
          inc=image/config/includes.chroot
          shellcheck -x -P "$inc" -S warning \
            $inc/usr/local/sbin/* $inc/usr/local/bin/reims-* \
            $inc/etc/profile.d/*.sh $inc/etc/grub.d/* $inc/etc/kernel/post*.d/* \
            image/config/hooks/live/*.chroot scripts/*.sh
