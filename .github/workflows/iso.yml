name: ISO

# Build pesado (~10–20 min). Não roda em cada push: só sob demanda e em tags v*.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write # anexar a ISO à release nas tags

concurrency:
  group: iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-iso:
    name: build OSX-REIMS-OS ISO
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: reimsctl

      - name: Build reimsctl + stage includes (host)
        run: SKIP_LB=1 scripts/build-iso.sh

      # O live-build precisa ser o da própria Debian trixie: rodar num container
      # debian:trixie evita os defaults errados do live-build empacotado no Ubuntu
      # (modo ubuntu, suite de security, path do Contents, flavor sysvinit).
      - name: Build ISO (debian:trixie container)
        run: |
          docker run --rm --privileged \
            -v "$PWD":/work -w /work/image \
            debian:trixie bash -euo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y live-build
              lb clean --purge || true
              ./auto/config
              lb build
            '

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: osx-reims-os-iso
          path: image/*.iso
          if-no-files-found: error

      - name: Attach ISO to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "OSX-REIMS-OS ${{ github.ref_name }}"
          # tags com hífen (ex.: v0.1.0-beta.1) viram pré-release
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: image/*.iso
