name: ISO

# Build pesado (~10–20 min). Não roda em cada push: só sob demanda e em tags v*.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write # anexar a ISO à release nas tags

concurrency:
  group: iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-iso:
    name: build OSX-REIMS-OS ISO
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: reimsctl

      - name: Install live-build
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap debian-archive-keyring

      - name: Build ISO
        # Roda como usuário normal: o cargo build corre como o usuário e o
        # build-iso.sh usa `sudo` internamente só para o `lb build`.
        run: scripts/build-iso.sh

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: osx-reims-os-iso
          path: image/*.iso
          if-no-files-found: error

      - name: Attach ISO to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: image/*.iso
